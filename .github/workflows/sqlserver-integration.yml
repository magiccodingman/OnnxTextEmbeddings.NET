name: SQL Server 2025 vector and full-text integration

on:
  push:
    branches-ignore:
      - release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlserver-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: OnnxTextEmbeddings!2026
        ports:
          - 1433:1433

    env:
      SQLSERVER_CONNECTION_STRING: Server=localhost,1433;User ID=sa;Password=OnnxTextEmbeddings!2026;Encrypt=False;TrustServerCertificate=True;Initial Catalog=master

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install SQL Server Full-Text Search
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server:2025-latest --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec -u 0 "$container_id" bash -lc '
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates gnupg
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/mssql-server-2025.list -o /etc/apt/sources.list.d/mssql-server-2025.list
            apt-get update
            DEBIAN_FRONTEND=noninteractive ACCEPT_EULA=Y apt-get install -y mssql-server-fts
          '
          docker restart "$container_id"
      - name: Run SQL Server vector + full-text integration
        run: dotnet run --project tests/OnnxTextEmbeddings.SqlServerIntegration/OnnxTextEmbeddings.SqlServerIntegration.csproj --configuration Release
