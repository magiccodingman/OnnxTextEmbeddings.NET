name: Default model integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jasper-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run sample against default Jasper INT8 model
        run: dotnet run --project samples/OnnxTextEmbeddings.Sample.Console/OnnxTextEmbeddings.Sample.Console.csproj --configuration Release
